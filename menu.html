{% extends "base.html" %}
{% block content %}
    <h1>{{ restaurant.get_name() }}</h1>
    <p><a href="/">&larr; back to restaurants</a></p>

    {% for item in menu_data %}
        <div class="item">
            <strong>{{ item.name }}</strong> - GHS {{ item.price }} ({{ item.category }})
            {% if item.calories %}
                <br><small>approx {{ item.calories }} cal</small>
            {% endif %}
            <form action="/add" method="post">
                <input type="hidden" name="item_name" value="{{ item.name }}">
                Qty: <input type="number" name="quantity" value="1" min="1">
                <button type="submit">Add to cart</button>
            </form>
        </div>
    {% endfor %}

    <p><a href="/cart">View cart</a></p>
{% endblock %}
